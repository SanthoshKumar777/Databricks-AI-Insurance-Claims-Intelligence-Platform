# Databricks App Configuration
# Insurance Claims Intelligence Platform

# App metadata
app_name: insurance-claims-intelligence
app_version: "1.0.0"
description: "AI-Powered Insurance Claims Investigation & Fraud Detection Platform"

# Application entry point
command: ["streamlit", "run", "src/databricks_app.py", "--server.port=8080", "--server.address=0.0.0.0"]

# Compute configuration
compute:
  # Use serverless compute for auto-scaling
  type: serverless
  # Or specify a cluster for dedicated resources
  # cluster_name: "claims-app-cluster"

# Environment configuration
environment:
  python_version: "3.10"
  
  # Python dependencies
  dependencies:
    - streamlit>=1.28.0
    - pandas>=2.0.0
    - plotly>=5.17.0
    - databricks-sdk>=0.20.0
    - sentence-transformers>=2.2.0
    - mlflow>=2.9.0
    - requests>=2.31.0

# Resource limits (optional)
resources:
  memory: "4Gi"
  cpu: "2"

# Environment variables
env:
  CATALOG: "main"
  SCHEMA: "insurance_claims"
  # Add any other app-specific environment variables here

# Port configuration
ports:
  - name: http
    port: 8080
    protocol: TCP

# Health check configuration
health_check:
  path: /_stcore/health
  port: 8080
  initial_delay_seconds: 30
  period_seconds: 10
  timeout_seconds: 5
  failure_threshold: 3

# Access control (optional)
# access:
#   - user: "user@company.com"
#     permission: "CAN_VIEW"
#   - group: "claims_investigators"
#     permission: "CAN_MANAGE"

# Logging
logging:
  level: INFO
  
# Auto-scaling (for serverless)
scaling:
  min_instances: 1
  max_instances: 5
  target_cpu_utilization: 80

# Tags for organization
tags:
  - project: "insurance-claims"
  - environment: "production"
  - team: "data-science"
  - use_case: "fraud-detection"
